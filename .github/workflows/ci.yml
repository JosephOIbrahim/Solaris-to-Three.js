name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Also run the headless browser test (several minutes on software rendering)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a push to main never cancels an on-demand browser run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same OpenUSD release the browser runtime is built on (26.05), plus lxml for X3D 4.0 XSD checks.
      - name: Install usd-core and lxml
        run: python -m pip install "usd-core==26.5" lxml

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Syntax and HTTP security checks
        run: |
          npm run test:syntax
          npm run test:server

  browser:
    name: Headless browser test
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start the server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5180/ > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1

      - name: Smoke test
        run: npm run test:browser

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: shots/
          if-no-files-found: ignore
