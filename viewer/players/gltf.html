<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>glTF · Solaris to three.js</title>
  <style>
    :root { color-scheme: dark; --ink: #e8e6e1; --dim: #8d8a84; --line: #2a2926; --bg: #0d0d0c; --accent: #e0a458; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 13px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 12px; top: 12px; max-width: min(360px, calc(100vw - 24px));
      background: rgba(13,13,12,.82); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    #hud h1 { font: 600 13px/1.2 inherit; margin: 0 0 6px; }
    #hud p { margin: 4px 0 0; color: var(--dim); }
    #status { position: fixed; left: 12px; bottom: 12px; right: 12px; color: var(--dim);
      white-space: pre-wrap; text-shadow: 0 1px 2px #000; }
  </style>
  <!-- The same import map as the main viewer, minus the Needle entries: this player is MIT
       three.js only. ?three=185 runs it on r185 alongside the main page. -->
  <script>
    (() => {
      const ver = new URLSearchParams(location.search).get("three") === "185" ? "185" : "187";
      const three = ver === "185" ? "/vendor/three-r185" : "/vendor/three";
      const map = { imports: {
        "three": `${three}/build/three.module.js`,
        "three/addons/": `${three}/examples/jsm/`,
        "three/examples/jsm/": `${three}/examples/jsm/` } };
      const s = document.createElement("script");
      s.type = "importmap";
      s.textContent = JSON.stringify(map);
      document.currentScript.after(s);
      window.__threeVariant = ver;
    })();
  </script>
</head>
<body>
  <div id="hud">
    <h1>glTF · three.js</h1>
    <p id="sub">loading…</p>
  </div>
  <div id="status"></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const report = { url: null, revision: THREE.REVISION, ready: false, errors: [],
                     meshes: 0, instanced: 0, triangles: 0, lights: 0, cameras: 0, materials: 0,
                     extensions: [], title: null };
    window.__gltf = report;
    addEventListener("error", (e) => report.errors.push(String(e.message || e)));
    addEventListener("unhandledrejection", (e) => report.errors.push(String(e.reason?.message || e.reason)));

    const status = document.getElementById("status");
    // ?model=/fixtures/stage-flat/hero.glb  (must be same-origin under /fixtures/ or /stages/)
    const rawModel = new URLSearchParams(location.search).get("model") || "/fixtures/stage-flat/hero.glb";
    let modelUrl;
    try {
      const u = new URL(rawModel, location.href);
      if (u.origin !== location.origin || !/^\/(fixtures|stages)\//.test(u.pathname)) {
        throw new Error(`blocked model URL (must be same-origin under /fixtures/ or /stages/): ${rawModel}`);
      }
      modelUrl = u.href;
      report.url = modelUrl;
    } catch (e) {
      report.errors.push(String(e.message || e));
      status.textContent = String(e.message || e);
      report.ready = true;
      throw e;
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.AgXToneMapping;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101010);
    // MIT neutral PMREM IBL so metallic PBR surfaces reflect instead of rendering black.
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;
    scene.environmentIntensity = 0.65;
    pmrem.dispose();

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 500);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    let usdCam = null;
    let mixer = null;

    function syncCamera() {
      if (!usdCam) return;
      usdCam.updateWorldMatrix(true, false);
      usdCam.matrixWorld.decompose(camera.position, camera.quaternion, new THREE.Vector3());
      camera.near = usdCam.near; camera.far = usdCam.far;
      camera.aspect = innerWidth / innerHeight;
      // Keep the authored frame fully visible on narrow screens, exactly as main.js does.
      const a = camera.aspect, tanV = Math.tan(THREE.MathUtils.degToRad(usdCam.fov) / 2);
      const authoredAspect = usdCam.aspect > 0 ? usdCam.aspect : a;
      camera.fov = a >= authoredAspect
        ? usdCam.fov
        : THREE.MathUtils.radToDeg(2 * Math.atan(tanV * authoredAspect / a));
      camera.updateProjectionMatrix();
      report.cameraUsed = true;
      report.cameraFov = +camera.fov.toFixed(2);
      report.cameraPosition = [+camera.position.x.toFixed(2), +camera.position.y.toFixed(2),
                               +camera.position.z.toFixed(2)];
    }

    try {
      const gltf = await loader.loadAsync(modelUrl);
      scene.add(gltf.scene);
      const extras = gltf.scene.userData?.web || gltf.userData?.web || null;
      report.title = extras?.title || null;
      if (report.title) {
        document.title = report.title;
        document.querySelector("#hud h1").textContent = report.title;
      }
      if (typeof extras?.exposureOffset === "number" && Number.isFinite(extras.exposureOffset)) {
        renderer.toneMappingExposure = 2 ** extras.exposureOffset;
      }
      report.extensions = gltf.parser?.json?.extensionsUsed || [];

      const box = new THREE.Box3(), materials = new Set();
      gltf.scene.traverse((o) => {
        if (o.isInstancedMesh) report.instanced += o.count;
        else if (o.isMesh) report.meshes += 1;
        if (o.isMesh) {
          const m = Array.isArray(o.material) ? o.material[0] : o.material;
          if (m) materials.add(m.uuid);
          const mult = o.isInstancedMesh ? o.count : 1;
          if (o.geometry?.index) report.triangles += (o.geometry.index.count / 3) * mult;
          else if (o.geometry?.attributes?.position) report.triangles += (o.geometry.attributes.position.count / 3) * mult;
        }
        if (o.isLight) report.lights += 1;
        if (o.isCamera) report.cameras += 1;
      });
      report.materials = materials.size;

      // B4: frame from the exported perspective camera when present; fallback to bounds otherwise.
      gltf.scene.traverse((o) => { if (!usdCam && o.isPerspectiveCamera) usdCam = o; });
      if (usdCam) {
        syncCamera();
        box.setFromObject(gltf.scene);
        const dist = !box.isEmpty()
          ? Math.max(0.5, camera.position.distanceTo(box.getCenter(new THREE.Vector3())))
          : 4;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        controls.target.copy(camera.position).addScaledVector(forward, dist);
        controls.update();
      } else {
        box.setFromObject(gltf.scene);
        if (!box.isEmpty()) {
          const size = box.getSize(new THREE.Vector3()).length();
          const centre = box.getCenter(new THREE.Vector3());
          camera.position.copy(centre).add(new THREE.Vector3(0.7, 0.5, 1).normalize().multiplyScalar(size * 0.9));
          camera.lookAt(centre);
          controls.target.copy(centre);
          camera.near = Math.max(0.01, size / 500); camera.far = size * 10;
          camera.updateProjectionMatrix();
          controls.update();
        }
      }
      if (report.lights === 0) {
        const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 1.2); scene.add(hemi);
        const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3, 5, 4); scene.add(key);
      }
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(gltf.scene);
        for (const clip of gltf.animations) mixer.clipAction(clip).play();
      }
      renderer.render(scene, camera);
      report.ready = true;
      document.getElementById("sub").textContent =
        `${report.meshes} meshes · ${report.instanced} instances · ${Math.round(report.triangles)} triangles`;
      status.textContent = `three r${THREE.REVISION} · ${new URL(modelUrl).pathname}`;
    } catch (e) {
      report.errors.push(String(e.message || e));
      status.textContent = `could not load ${modelUrl}\n${e.message || e}`;
    }

    addEventListener("resize", () => {
      renderer.setSize(innerWidth, innerHeight);
      if (usdCam) {
        syncCamera();
      } else {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
    });
    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
      if (mixer) mixer.update(dt);
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
