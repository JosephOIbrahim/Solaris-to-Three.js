<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>X3D · Solaris to three.js</title>
  <style>
    :root { color-scheme: dark; --ink: #e8e6e1; --dim: #8d8a84; --line: #2a2926; --bg: #0d0d0c; --accent: #e0a458; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 13px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    x3d-canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 12px; top: 12px; max-width: min(360px, calc(100vw - 24px));
      background: rgba(13,13,12,.82); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      pointer-events: none; }
    #hud h1 { font: 600 13px/1.2 inherit; margin: 0 0 6px; }
    #hud p, #status { margin: 4px 0 0; color: var(--dim); }
    #status { position: fixed; left: 12px; bottom: 12px; right: 12px; white-space: pre-wrap; }
  </style>
  <!-- X_ITE is MIT (Copyright (c) 2009 Holger Seelig and other contributors), pinned and loaded
       from jsDelivr as its documentation recommends. No build step, no vendored copy. -->
  <script defer src="https://cdn.jsdelivr.net/npm/x_ite@16.7.1/dist/x_ite.min.js"></script>
</head>
<body>
  <div id="hud"><h1>X3D · X_ITE</h1><p id="sub">loading…</p></div>
  <div id="status"></div>
  <x3d-canvas id="scene" contentScale="auto" update="auto"></x3d-canvas>

  <script>
    // ?model=/fixtures/stage-flat/hero.x3d  (the exporter's own output)
    (() => {
      const model = new URL(new URLSearchParams(location.search).get("model") || "/fixtures/stage-flat/hero.x3d",
                            location.href).href;
      const report = { url: model, ready: false, loaded: false, errors: [],
                       switches: 0, uses: 0, shapes: 0, viewpoints: 0, materials: 0, lights: 0 };
      window.__x3d = report;
      addEventListener("error", (e) => report.errors.push(String(e.message || e)));
      addEventListener("unhandledrejection", (e) => report.errors.push(String(e.reason?.message || e.reason)));

      const canvas = document.getElementById("scene");
      canvas.setAttribute("src", model);
      canvas.addEventListener("load", () => { report.loaded = true; });
      canvas.addEventListener("initialized", () => { report.loaded = true; });
      canvas.addEventListener("error", (e) => report.errors.push("X_ITE could not load the scene"));

      // X_ITE exposes no node counts, so the page reads the file it was given: the same bytes
      // the browser renders, counted independently of the renderer.
      fetch(model)
        .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
        .then((text) => {
          const doc = new DOMParser().parseFromString(text, "application/xml");
          if (doc.querySelector("parsererror")) throw new Error("the .x3d is not well-formed XML");
          report.switches = doc.getElementsByTagName("Switch").length;
          report.uses = Array.from(doc.getElementsByTagName("*")).filter((el) => el.hasAttribute("USE")).length;
          report.shapes = doc.getElementsByTagName("Shape").length;
          report.viewpoints = doc.getElementsByTagName("Viewpoint").length;
          report.materials = doc.getElementsByTagName("PhysicalMaterial").length;
          report.lights = doc.getElementsByTagName("PointLight").length
                        + doc.getElementsByTagName("DirectionalLight").length;
          report.ready = true;
          document.getElementById("sub").textContent =
            `${report.shapes} shapes · ${report.uses} instances · ${report.switches} switches`;
          document.getElementById("status").textContent = `X_ITE · ${new URL(model).pathname}`;
        })
        .catch((e) => { report.errors.push(String(e.message || e)); report.ready = true; });
    })();
  </script>
</body>
</html>
